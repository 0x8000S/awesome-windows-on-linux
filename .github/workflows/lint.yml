name: Lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run lint
        run: |
          python main.py lint
          python main.py check
          python main.py cl

      - name: Verify generate is reproducible
        run: |
          python main.py generate --lang en-US --out /tmp/readme.en.md
          python main.py generate --lang zh-CN --out /tmp/readme.zh.md
          diff /tmp/readme.en.md README.md
          diff /tmp/readme.zh.md README.zh-CN.md
